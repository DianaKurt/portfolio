<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Diana Suchkova — Frontend Developer | React. Портфолио проектов и опыт."
    />
    <meta name="theme-color" content="#faf9f6" />
    <title>Diana Suchkova — Frontend Developer</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
          var storedLocale = localStorage.getItem('portfolio-locale')
          if (storedLocale === 'ru' || storedLocale === 'en') {
            document.documentElement.lang = storedLocale
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
